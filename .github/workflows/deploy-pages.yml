
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If your site needs a build step (Node, Hugo, Jekyll, etc.), uncomment and adjust the following:
      # - name: Install dependencies
      #   run: |
      #     npm ci
      # - name: Build
      #   run: |
      #     npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          # Change this to your generated site directory (e.g., 'build', 'dist', 'public', '.' for repo root)
          path: './public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
